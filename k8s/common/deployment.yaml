apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ui
  namespace: agentic-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-ui
  template:
    metadata:
      labels:
        app: agentic-ui
    spec:
      containers:
        - name: app
          image: ${IMAGE}
          ports:
            - containerPort: 4000
          env:
            # Env vars públicas
            - name: PHX_SERVER
              value: "true"
            - name: PORT
              value: "4000"
            - name: OPENAI_BASE_URL
              value: "https://api.openai.com/v1"
            - name: AGENT_MODEL
              value: "gpt-4.1-mini"
            - name: OPENAI_REQUEST_TIMEOUT
              value: "120000"
            - name: OPENAI_MAX_RETRIES
              value: "6"
            - name: AGENT_TEMPERATURE
              value: "0.0"
            - name: PHX_HOST
              value: "localhost"
            # Env vars sensibles (desde el secret)
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: agentic-ui-secrets
                  key: SECRET_KEY_BASE
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentic-ui-secrets
                  key: OPENAI_API_KEY
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
